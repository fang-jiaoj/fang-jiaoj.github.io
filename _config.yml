# Jiaojiao Fang academic homepage

title                    : "方娇娇 | Jiaojiao Fang"
description              : "方娇娇的个人学术主页：人工智能驱动药物发现、ADMET 预测、酶-底物相互作用建模。"
lang                     : "zh-CN"
url                      : "https://jiaojiaofang.github.io"
baseurl                  : ""
repository               : "jiaojiaofang/jiaojiaofang.github.io"
google_scholar_stats_use_cdn : false

google_analytics_id      :
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

author:
  name             : "方娇娇"
  name_en          : "Jiaojiao Fang"
  avatar           : "/images/profile.jpg"
  bio              : 'Ph.D. Student @ ECUST<br><strong><a href="https://lmmd.ecust.edu.cn/">Laboratory of Molecular Modeling &amp; Design</a></strong>'
  location         : "Shanghai, China"
  employer         : "华东理工大学药学院"
  employer_en      : "School of Pharmacy, ECUST"
  employer_url     : "https://pharmacy.ecust.edu.cn/"
  pubmed           :
  googlescholar    :
  email            : "fjj3444764878@163.com"
  researchgate     :
  uri              :
  github           :
  github_url       : "https://github.com/fang-jiaoj/MFPK"
  github_label     : "jiaojiaofang"
  linkedin         :
  dblp             :
  orcid            :
  twitter          :
  weibo            :

include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - CONTENT_SOURCE.md
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
